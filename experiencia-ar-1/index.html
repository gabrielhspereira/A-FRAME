<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiência AR - Planeta Terra</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .info {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 2px 5px black;
    }
  </style>
</head>

<body>
  <div class="info">
    <h3>PLANETA TERRA</h3>
    <p>Aponta a câmara para o marcador Hiro</p>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true"
    vr-mode-ui="enabled: false">

    <a-assets>
      <img
        id="earthTexture"
        src="https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
        crossorigin="anonymous">
    </a-assets>

    <a-marker preset="hiro" smooth="true">

      <!-- Planeta Terra -->
      <a-sphere
        position="0 0.8 0"
        radius="0.65"
        material="src: #earthTexture; roughness: 1"
        animation="property: rotation;

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teste AR.js - Cubo Hiro</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #mensagem {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      text-shadow: 0 2px 5px black;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="mensagem">
    <h2>Teste de Realidade Aumentada</h2>
    <p>Aponta a câmara para o marcador Hiro</p>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true"
    vr-mode-ui="enabled: false">

    <!-- Marcador Hiro -->
    <a-marker preset="hiro">

      <!-- Cubo simples -->
      <a-box
        position="0 0.5 0"
        rotation="0 0 0"
        color="#00FF00"
        material="roughness: 0.5"
        scale="1 1 1">

      </a-box>

    </a-marker>

    <!-- Câmara -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
