
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiência AR 1 - Globo Giratório</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .painel {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 14px;
            max-width: 270px;
            color: white;
            background: rgba(8, 18, 43, 0.9);
            border: 1px solid #38bdf8;
            border-radius: 12px;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 8px;
            color: #7dd3fc;
            font-size: 19px;
        }

        p {
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="painel">
        <h1>🌍 Globo Giratório</h1>
        <p>Experiência de Realidade Aumentada</p>
        <p>Aponta a câmara para o marcador HIRO.</p>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        renderer="antialias: true"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-entity
            light="type: ambient; color: #ffffff; intensity: 1.2">
        </a-entity>

        <a-entity
            light="type: directional; color: #ffffff; intensity: 1.5"
            position="-3 5 4">
        </a-entity>

        <a-marker preset="hiro" smooth="true">

            <!-- Base do planeta -->
            <a-cylinder
                position="0 0.08 0"
                radius="0.8"
                height="0.12"
                color="#12345a">
            </a-cylinder>

            <!-- Planeta Terra -->
            <a-sphere
                position="0 1.15 0"
                radius="0.72"
                segments-width="48"
                segments-height="32"
                material="src: url(https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg)"
                animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
            </a-sphere>

            <!-- Aro animado -->
            <a-torus
                position="0 1.15 0"
                rotation="65 0 0"
                radius="0.9"
                radius-tubular="0.015"
                color="#38bdf8"
                animation="property: rotation; to: 65 360 0; dur: 14000; easing: linear; loop: true">
            </a-torus>

            <!-- Texto -->
            <a-text
                value="PLANETA TERRA"
                position="0 2.15 0"
                rotation="-90 0 0"
                align="center"
                color="#ffffff"
                width="4">
            </a-text>

            <a-text
                value="Globo em rotacao continua"
                position="0 2.0 0"
                rotation="-90 0 0"
                align="center"
                color="#7dd3fc"
                width="3">
            </a-text>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
