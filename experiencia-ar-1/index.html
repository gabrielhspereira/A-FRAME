
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Realidade Aumentada - Marcador Hiro</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    #status {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 14px 10px;
      text-align: center;
      color: white;
      background: rgba(20, 20, 35, 0.8);
      z-index: 10;
      pointer-events: none;
    }

    #status h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    #status p {
      margin: 0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="status">
    <h2>Realidade Aumentada</h2>
    <p>Aponta a câmara para o marcador Hiro.</p>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="alpha: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; detectionMode: mono; matrixCodeType: 3x3; debugUIEnabled: false;"
    loading-screen="enabled: false">

    <!-- Marcador Hiro -->
    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="5"
      smoothTolerance="0.01"
      smoothThreshold="2">

      <!-- Cubo 3D -->
      <a-box
        position="0 0.5 0"
        rotation="0 0 0"
        scale="0.7 0.7 0.7"
        material="color: #ff3030; roughness: 0.4; metalness: 0.1"
        shadow="cast: true; receive: true">

        <!-- Contorno luminoso -->
        <a-entity
          geometry="primitive: box"
          scale="1.02 1.02 1.02"
          material="color: #ffffff; wireframe: true; shader: flat"
        ></a-entity>

      </a-box>

      <!-- Base do cubo -->
      <a-cylinder
        position="0 0.03 0"
        radius="0.38"
        height="0.04"
        color="#28a9ff">
      </a-cylinder>

    </a-marker>

    <!-- Câmara -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
