<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiência AR - Planeta Terra</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .info {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 2px 5px black;
    }
  </style>
</head>

<body>
  <div class="info">
    <h3>PLANETA TERRA</h3>
    <p>Aponta a câmara para o marcador Hiro</p>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="antialias: true; alpha: true"
    vr-mode-ui="enabled: false">

    <a-assets>
      <img
        id="earthTexture"
        src="https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
        crossorigin="anonymous">
    </a-assets>

    <a-marker preset="hiro" smooth="true">

      <!-- Planeta Terra -->
      <a-sphere
        position="0 0.8 0"
        radius="0.65"
        material="src: #earthTexture; roughness: 1"
        animation="property: rotation;
                   to: 0 360 0;
                   loop: true;
                   dur: 12000;
                   easing: linear">
      </a-sphere>

      <!-- Órbita decorativa -->
      <a-torus
        position="0 0.8 0"
        rotation="65 0 0"
        radius="0.95"
        radius-tubular="0.012"
        material="color: #55DFFF; metalness: 0.5">
      </a-torus>

      <!-- Base luminosa -->
      <a-cylinder
        position="0 0.05 0"
        radius="0.48"
        height="0.06"
        material="color: #168BFF; emissive: #064A99">
      </a-cylinder>

      <!-- Título sobre o marcador -->
      <a-text
        value="PLANETA TERRA"
        position="0 1.65 0"
        align="center"
        color="#FFFFFF"
        width="3"
        shader="msdf">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
