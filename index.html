
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A-Frame | A minha primeira cena 3D</title>

    <!-- Biblioteca A-Frame -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
        }

        .info {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            color: white;
            background: rgba(17, 24, 39, 0.85);
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 290px;
            line-height: 1.5;
            pointer-events: none;
        }

        .info h1 {
            margin: 0 0 6px;
            font-size: 20px;
            color: #4CC3D9;
        }

        .info p {
            margin: 4px 0;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <!-- Informação apresentada na página -->
    <div class="info">
        <h1>A-Frame | Experiência 3D</h1>
        <p>Projeto de Realidade Virtual</p>
        <p>Autor: Gabriel Pereira</p>
        <p>Explora a cena com o rato ou o telemóvel.</p>
    </div>

    <!-- Cena 3D -->
    <a-scene
        background="color: #111827"
        renderer="antialias: true"
        vr-mode-ui="enabled: true">

        <!-- Iluminação -->
        <a-entity
            light="type: ambient; color: #FFFFFF; intensity: 0.8">
        </a-entity>

        <a-entity
            light="type: directional; color: #FFFFFF; intensity: 1.2"
            position="-3 5 2">
        </a-entity>

        <!-- Cubo -->
        <a-box
            position="-1 1 -3"
            rotation="0 45 0"
            width="1.2"
            height="1.2"
            depth="1.2"
            color="#4CC3D9"
            shadow>
        </a-box>

        <!-- Esfera -->
        <a-sphere
            position="0 1.25 -5"
            radius="0.8"
            color="#EF2D5E"
            segments-width="32"
            segments-height="24"
            shadow>
        </a-sphere>

        <!-- Cilindro -->
        <a-cylinder
            position="1.5 0.75 -3.5"
            radius="0.5"
            height="1.5"
            color="#FFC65D"
            shadow>
        </a-cylinder>

        <!-- Chão -->
        <a-plane
            position="0 0 -4"
            rotation="-90 0 0"
            width="20"
            height="20"
            color="#7BC8A4"
            shadow>
        </a-plane>

        <!-- Texto na cena -->
        <a-text
            value="Ola, A-Frame!"
            position="-1.2 2.5 -4"
            color="#FFFFFF"
            width="5"
            align="center">
        </a-text>

        <a-text
            value="A minha primeira experiencia 3D"
            position="-1.5 2.15 -4"
            color="#D1D5DB"
            width="5"
            align="center">
        </a-text>

        <!-- Céu -->
        <a-sky color="#172554"></a-sky>

        <!-- Câmara e controlos -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls wasd-controls>
                <a-cursor
                    color="#FFFFFF"
                    fuse="false">
                </a-cursor>
            </a-camera>
        </a-entity>

    </a-scene>

</body>
</html>
