
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A-Frame - Cena 3D</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .info {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 10;
            padding: 15px 20px;
            background: rgba(15, 23, 42, 0.92);
            color: #FFFFFF;
            border: 1px solid #38BDF8;
            border-radius: 12px;
            max-width: 280px;
        }

        .info h1 {
            margin: 0 0 8px;
            color: #38BDF8;
            font-size: 20px;
        }

        .info p {
            margin: 5px 0;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="info">
        <h1>O meu mundo 3D</h1>
        <p>Projeto A-Frame</p>
        <p>Autor: Gabriel Pereira</p>
        <p>Explora o espaço com o rato.</p>
    </div>

    <a-scene
        background="color: #10152F"
        renderer="antialias: true"
        vr-mode-ui="enabled: true">

        <!-- Iluminação geral -->
        <a-entity
            light="type: ambient; color: #FFFFFF; intensity: 0.8">
        </a-entity>

        <a-entity
            light="type: directional; color: #FFFFFF; intensity: 1.5"
            position="-3 6 4">
        </a-entity>

        <!-- Cubo azul-turquesa -->
        <a-box
            position="-1.5 1 -4"
            rotation="0 35 0"
            width="1.3"
            height="1.3"
            depth="1.3"
            color="#00E5FF">
        </a-box>

        <!-- Esfera rosa -->
        <a-sphere
            position="0 1.3 -5"
            radius="0.85"
            color="#FF3CAC"
            segments-width="32"
            segments-height="24">
        </a-sphere>

        <!-- Cilindro amarelo -->
        <a-cylinder
            position="1.7 0.9 -4"
            radius="0.5"
            height="1.8"
            color="#FFE14D">
        </a-cylinder>

        <!-- Plano verde -->
        <a-plane
            position="0 0 -4"
            rotation="-90 0 0"
            width="20"
            height="20"
            color="#243B55">
        </a-plane>

        <!-- Texto principal -->
        <a-text
            value="BEM-VINDO AO A-FRAME"
            position="-1.8 3 -4"
            color="#FFFFFF"
            width="6"
            align="center">
        </a-text>

        <a-text
            value="Explora a minha primeira cena 3D"
            position="-1.8 2.65 -4"
            color="#38BDF8"
            width="5.5"
            align="center">
        </a-text>

        <!-- Fundo do ambiente -->
        <a-sky color="#10152F"></a-sky>

        <!-- Câmara -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls wasd-controls>
                <a-cursor color="#FFFFFF"></a-cursor>
            </a-camera>
        </a-entity>

    </a-scene>

</body>
</html>
